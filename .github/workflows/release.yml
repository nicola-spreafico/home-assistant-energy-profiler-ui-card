name: Draft release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check tag version
        run: node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); if(process.env.GITHUB_REF_NAME !== "v"+p.version) process.exit(1)'
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: git diff --exit-code -- dist/
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/home-assistant-energy-profiler-ui-card.js dist/SHA256SUMS --draft --verify-tag --generate-notes
